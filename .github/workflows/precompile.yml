name: Precompile NIFs
on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27.0"

jobs:
  precompile:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            otp: '27.0'
            elixir: '1.18'
            backend: metal
          # OTP 29 is the first release to report NIF 2.18; OTP 27/28 both
          # report 2.17, so building on 28 would just overwrite the 27 artifact.
          - os: macos-14
            target: aarch64-apple-darwin
            otp: '29.0'
            elixir: '1.20'
            backend: metal
          - os: ubuntu-22.04
            target: x86_64-linux-gnu
            otp: '27.0'
            elixir: '1.18'
            backend: cpu
          - os: ubuntu-22.04
            target: x86_64-linux-gnu
            otp: '29.0'
            elixir: '1.20'
            backend: cpu

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Install cmake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i'' -e "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs
      - run: mix deps.get
      - name: Create precompiled library
        run: |
          export ELIXIR_MAKE_CACHE_DIR=$(pwd)/cache
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix elixir_make.precompile
        env:
          LLAMA_BACKEND: ${{ matrix.backend }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" --generate-notes cache/*.tar.gz || \
          gh release upload "$TAG_NAME" cache/*.tar.gz --clobber

  checksum:
    needs: precompile
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs
      - run: mix deps.get
      - run: mix elixir_make.checksum --all --ignore-unavailable
      - name: Commit checksum.exs
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add checksum.exs
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update checksum.exs for ${TAG_NAME}"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/master"
            git fetch origin master
            git rebase origin/master
          done
          echo "Failed to push checksum commit after 5 attempts"
          exit 1

  publish:
    name: Publish to Hex
    runs-on: ubuntu-22.04
    needs: [checksum]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Set version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish to Hex
        run: mix hex.publish --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
