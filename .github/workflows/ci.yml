name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27.0"

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-22.04
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      plt-key: ${{ steps.key.outputs.plt }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libgomp1

      - name: Compute cache keys
        id: key
        env:
          SRC_HASH: ${{ hashFiles('mix.lock', 'c_src/**', 'Makefile') }}
          LOCK_HASH: ${{ hashFiles('mix.lock') }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          SUB_SHA=$(git -C vendor/llama.cpp rev-parse HEAD)
          echo "value=${RUNNER_OS}-mix-${ELIXIR_VERSION}-${OTP_VERSION}-test-${SRC_HASH}-${SUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "plt=${RUNNER_OS}-plt-${ELIXIR_VERSION}-${OTP_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache deps & build
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.key.outputs.value }}

      - run: mix deps.get
        if: steps.cache.outputs.cache-hit != 'true'

      - run: mix compile --warnings-as-errors
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LLAMA_BACKEND: cpu

  format:
    name: Formatting
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix format --check-formatted

  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix test
        env:
          LLAMA_BACKEND: cpu

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-22.04
    needs: [setup]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ needs.setup.outputs.plt-key }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix dialyzer
